services:
  web:
    build: .
    container_name: newgcon_app
    restart: always
    environment:
      - FLASK_ENV=production
      - DB_HOST=172.27.8.12
      - DB_USER=root
      - DB_PASS=F1n
      - DB_NAME=gcon

  nginx:
    image: nginx:alpine
    container_name: newgcon_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web